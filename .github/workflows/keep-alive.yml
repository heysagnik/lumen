name: Keep Render services alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Stop after 30 days
        id: window
        run: |
          cutoff="2026-10-09"
          today=$(date -u +%F)
          if [[ "$today" > "$cutoff" ]]; then
            echo "past keep-alive window ($cutoff), skipping"
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping API
        if: steps.window.outputs.active == 'true'
        run: curl -sS -o /dev/null https://lumen-obli.onrender.com/ || true

      - name: Ping web
        if: steps.window.outputs.active == 'true'
        run: curl -fsS -o /dev/null https://lumen.sagnik.fun || true
